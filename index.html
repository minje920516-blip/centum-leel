<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>센텀르엘 (매물)</title>
<style>
  :root{--ink:#0f172a; --ink2:#64748b}
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{display:flex; align-items:center; justify-content:center; padding:22px;
       background:radial-gradient(120% 120% at 50% 0%, #eff3f8 0%, #f3f5f7 42%, #e6ecf3 100%); color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
       -webkit-text-size-adjust:100%}
  .box{text-align:center; width:min(360px,100%)}
  .ic{width:48px; height:48px; margin:0 auto 12px; border-radius:15px; background:#fff; border:1px solid #e2e9f1;
      display:flex; align-items:center; justify-content:center; font-size:21px; box-shadow:0 6px 18px rgba(15,23,42,.06)}
  h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.6px}
  p{margin:7px 0 16px; font-size:12.5px; font-weight:600; color:var(--ink2)}
  .bar{width:132px; height:3px; margin:0 auto; border-radius:99px; background:#e2e8f0; overflow:hidden}
  .bar i{display:block; width:40%; height:100%; border-radius:99px; background:#94a3b8; animation:go 1s infinite ease-in-out}
  @keyframes go{0%{margin-left:-40%}100%{margin-left:100%}}
  .links{margin-top:18px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; font-size:12px; font-weight:700}
  .links a{color:#334155; text-decoration:none; border:1px solid #d8dfe7; background:#fff; border-radius:9px; padding:8px 12px}
</style>
</head>
<body>
<div class="box">
  <div class="ic">🔒</div>
  <h1>센텀르엘 (매물)</h1>
  <p>동호수 · 분양가 메모장을 여는 중…</p>
  <div class="bar"><i></i></div>
  <div class="links">
    <a id="to-pc" href="pc.html?v=202611211900">PC 화면</a>
    <a id="to-mo" href="mobile.html?v=202611211900">휴대폰 화면</a>
  </div>
</div>
<script>
(function(){
  var BUILD = '202611211900';
  var mode = null;
  try{ mode = localStorage.getItem('centum-leel-mode'); }catch(e){}
  var ua = navigator.userAgent || '';
  var mobileUA = /Mobi|Android|iPhone|iPad|iPod|Windows Phone|BlackBerry|Opera Mini|SamsungBrowser/i.test(ua);
  var touch = (navigator.maxTouchPoints || 0) > 1;
  var narrow = (window.innerWidth || 0) <= 768;
  var target = (mode === 'pc') ? 'pc.html'
             : (mode === 'mobile') ? 'mobile.html'
             : ((mobileUA || (touch && narrow) || narrow) ? 'mobile.html' : 'pc.html');
  try{ location.replace(target + '?v=' + BUILD); }catch(e){}
})();
</script>
</body>
</html>

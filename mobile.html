<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>센텀르엘 (매물)</title>
<style>
  :root{
    --gl:#e2e7ec; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
    --sale:#FEF08A; --rent:#BAE6FD; --done:#FCA5A5;
    --hd:#3d6f78;
    --tbh:96px;            /* sticky 헤더 높이(스크립트가 실측 보정) */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; max-width:100%; overflow-x:hidden}
  body{
    background:#f3f5f7; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
    font-size:13px; -webkit-text-size-adjust:100%;
  }

  /* ================= 헤더 ================= */
  .hd{position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid #dde2e7; box-shadow:0 1px 4px rgba(15,23,42,.06);
      padding-top:env(safe-area-inset-top)}
  .hd1{display:flex; align-items:center; gap:6px; padding:5px 10px 2px}
  .brand{font-weight:800; font-size:13px; letter-spacing:-.4px; white-space:nowrap; line-height:1.15}
  .brand small{display:block; font-weight:600; font-size:9.5px; color:var(--ink3); letter-spacing:0}
  .cnt{margin-left:auto; font-size:9.5px; color:var(--ink2); font-weight:700; white-space:nowrap; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end}
  .cnt i{font-style:normal; display:inline-flex; align-items:center; gap:3px}
  .cnt b{font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  .dot{width:7px; height:7px; border-radius:2.5px; display:inline-block; flex:0 0 auto}
  .dot.w{background:#fff; border:1px solid #b9c2cc}
  .dot.s{background:var(--sale); border:1px solid #d9b421}
  .dot.e{background:var(--rent); border:1px solid #56b6e0}
  .dot.r{background:var(--done); border:1px solid #e88}
  .dot.m{background:#64748b; border:none}

  .tabs{display:flex; gap:0; padding:0 6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto; min-width:52px; border:0; border-bottom:2.5px solid transparent; background:none; padding:5px 6px 4px;
               font-size:12.5px; font-weight:800; color:var(--ink3); font-family:inherit; cursor:pointer; letter-spacing:-.3px}
  .tabs button.on{color:#1d4ed8; border-bottom-color:#1d4ed8}
  .tabs button .n{display:block; font-size:8.5px; font-weight:700; color:#b6c0cb; letter-spacing:0; margin-top:-1px}
  .tabs button.on .n{color:#93b4f5}

  .filters{display:flex; align-items:center; gap:4px; padding:3px 8px 5px; overflow-x:auto; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters>*{flex:0 0 auto}
  .search{position:relative; flex:0 0 108px}
  .search input{width:100%; border:1px solid #dfe3e8; border-radius:7px; padding:5px 16px 5px 20px; font-size:11px; outline:none; background:#fff; font-family:inherit}
  .search svg{position:absolute; left:5px; top:50%; transform:translateY(-50%); opacity:.4}
  .seg{display:flex; border:1px solid #dfe3e8; border-radius:7px; overflow:hidden; background:#fff}
  .seg button{border:0; background:#fff; padding:5px 7px; font-size:10.5px; font-weight:700; color:var(--ink2); font-family:inherit;
              display:inline-flex; align-items:center; gap:3px; white-space:nowrap}
  .seg button+button{border-left:1px solid #eef1f5}
  .seg button.on{background:#eef2f6; color:var(--ink)}
  .more{margin-left:auto; border:1px solid #dfe3e8; background:#fff; border-radius:7px; width:30px; height:27px; font-size:14px; font-weight:800;
        color:var(--ink2); font-family:inherit; line-height:1; padding:0}
  .menu{position:fixed; z-index:70; right:8px; top:0; background:#fff; border:1px solid #dbe1e8; border-radius:10px;
        box-shadow:0 12px 30px rgba(15,23,42,.2); padding:5px; display:none; min-width:168px}
  .menu.on{display:block}
  .menu button{display:flex; width:100%; align-items:center; gap:6px; border:0; background:#fff; border-radius:7px; padding:9px 10px;
               font-size:12.5px; font-weight:700; color:var(--ink); font-family:inherit; text-align:left}
  .menu button:active{background:#f1f5f9}

  /* ================= 본문 ================= */
  main{padding:5px 6px calc(20px + env(safe-area-inset-bottom))}
  .unspec{font-size:10.5px; line-height:1.5; color:#7c2d12; background:#fff7ed; border:1px solid #fed7aa; border-radius:8px;
          padding:5px 8px; margin:2px 0 6px}
  .unspec b{font-weight:800}
  .unspec .ub{display:inline-block; font-weight:800; color:#9a3412; background:#ffedd5; border:1px solid #fdba74; border-radius:999px;
              padding:0 6px; margin-right:4px; font-size:9.5px}

  .dg{background:#fff; border:1px solid #e3e8ed; border-radius:9px; margin-bottom:7px; overflow:hidden; scroll-margin-top:8px}
  .dg-h{display:flex; align-items:baseline; gap:6px; padding:4px 8px; background:var(--hd); color:#fff}
  .dg-h b{font-size:13px; font-weight:800; letter-spacing:-.3px}
  .dg-h span{font-size:9.5px; font-weight:600; opacity:.85}
  .dg-h .tg{margin-left:auto; font-size:9px; font-weight:700; opacity:.9; letter-spacing:0}
  .dg-h .un{background:#ffedd5; color:#9a3412; border-radius:4px; padding:0 4px; font-size:8.5px; font-weight:800; opacity:1}

  table{width:100%; border-collapse:collapse; table-layout:fixed}
  col.fc{width:26px}
  th,td{padding:0; border:1px solid var(--gl); text-align:center; vertical-align:middle; overflow:hidden; white-space:nowrap}
  thead th{height:16px; background:#eef3f5; border-color:#d3dde1; font-size:8.5px; font-weight:800; color:#2f5b63; letter-spacing:-.3px}
  tbody th{height:21px; background:#fafbfc; font-size:8.5px; font-weight:700; color:#64748b; letter-spacing:-.4px; line-height:1}
  tbody th.evac{background:#edf3fa; color:#1d4ed8}
  td{height:21px; font-size:11px; font-weight:700; color:#16202b; letter-spacing:-.5px; font-variant-numeric:tabular-nums; line-height:1.05; background:#fff}
  td.c{position:relative; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; transition:background .08s, box-shadow .08s}
  td.c.s-sale{background:var(--sale); color:#3f3800}
  td.c.s-rent{background:var(--rent); color:#0b4a6f}
  td.c.s-done{background:var(--done); color:#7f1d1d}
  td.c.sel{box-shadow:inset 0 0 0 2px #2563eb}
  td.c.dim{opacity:.12}
  td.c.hit{box-shadow:inset 0 0 0 2px #f59e0b}
  td.fx{background:#fcfdfd; color:#7b8794; font-size:8px; font-weight:700; letter-spacing:-.4px}
  td.evac{background:#f5f8fb; color:#334155; font-size:8px; font-weight:700; letter-spacing:-.3px}
  td.blank{background:transparent; border:0}
  th.bz{background:transparent; border:0; color:#a9b4bf}

  .dgsum{display:flex; gap:5px; align-items:center; padding:4px 7px 5px; background:#f8fafb; border-top:1px solid #eef1f5; overflow-x:auto; scrollbar-width:none}
  .dgsum::-webkit-scrollbar{display:none}
  .dgsum span{flex:0 0 auto; font-size:8.5px; font-weight:700; color:#64748b; border:1px solid #e6eaee; border-radius:5px; padding:1px 4px}
  .dgsum span b{color:#334155; font-weight:800}

  /* ================= 하단 시트 ================= */
  .bd{position:fixed; inset:0; background:rgba(15,23,42,.36); opacity:0; pointer-events:none; transition:opacity .18s; z-index:60}
  .bd.on{opacity:1; pointer-events:auto}
  .sh{position:fixed; left:0; right:0; bottom:0; z-index:65; background:#fff; border-radius:16px 16px 0 0;
      box-shadow:0 -10px 34px rgba(15,23,42,.26); padding:0 13px calc(12px + env(safe-area-inset-bottom));
      transform:translateY(102%); transition:transform .22s cubic-bezier(.2,.8,.3,1); max-height:86vh; overflow-y:auto;
      -webkit-overflow-scrolling:touch}
  .sh.on{transform:none}
  .sh-grab{width:38px; height:4px; border-radius:99px; background:#d6dde4; margin:7px auto 4px}
  .sh-h{display:flex; align-items:center; gap:6px; position:sticky; top:0; background:#fff; padding:2px 0 4px; z-index:2}
  .sh-ho{font-size:17px; font-weight:800; letter-spacing:-.6px}
  .ty{font-size:10px; font-weight:800; border:1px solid #d7dde3; border-radius:5px; padding:1px 6px; margin-top:2px}
  .x{margin-left:auto; width:34px; height:34px; border:1px solid #c9d2db; border-radius:10px; background:#f1f5f9; color:#334155;
     font-size:20px; font-weight:700; font-family:inherit; line-height:1; display:flex; align-items:center; justify-content:center; padding:0}
  .x:active{background:#fee2e2; border-color:#fca5a5; color:#b91c1c}
  .price{font-size:21px; font-weight:800; letter-spacing:-.6px; margin:2px 0 6px; font-variant-numeric:tabular-nums}
  .g2{display:grid; grid-template-columns:1fr 1fr; gap:5px}
  .g2 div{background:#f8fafc; border:1px solid #eef1f5; border-radius:8px; padding:5px 8px; display:flex; align-items:baseline; gap:4px; flex-wrap:wrap}
  .g2 span{font-size:9.5px; font-weight:800; color:#94a3b8}
  .g2 b{font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums}
  .g2 i{font-style:normal; font-size:10px; font-weight:600; color:#64748b; margin-left:5px}
  .gye{margin:6px 0 8px; font-size:12.5px; font-weight:700; color:#334155}
  .gye b{font-weight:800; color:#0f172a; font-variant-numeric:tabular-nums}
  .st4{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px}
  .st4 button{display:flex; align-items:center; justify-content:center; gap:5px; border:1px solid #e2e6ea; background:#fff; border-radius:9px;
              padding:9px 4px; font-size:12.5px; font-weight:800; color:var(--ink2); font-family:inherit}
  .st4 button.on{color:var(--ink); box-shadow:inset 0 0 0 2px rgba(15,23,42,.8)}
  .st4 button[data-s="sale"].on{background:var(--sale); border-color:#d9b421}
  .st4 button[data-s="rent"].on{background:var(--rent); border-color:#56b6e0}
  .st4 button[data-s="done"].on{background:var(--done); border-color:#e88}
  textarea{width:100%; min-height:104px; border:1px solid #e2e6ea; border-radius:9px; padding:8px 9px; font-size:13px; line-height:1.6;
           font-family:inherit; outline:none; resize:vertical; color:var(--ink); background:#fff}
  textarea:focus{border-color:#94a3b8; box-shadow:0 0 0 3px rgba(148,163,184,.15)}
  .sh-f{display:flex; align-items:center; gap:7px; margin-top:8px}
  .saved{font-size:11px; font-weight:700; color:#16a34a; opacity:0; transition:opacity .3s}
  .saved.on{opacity:1}
  .del{margin-left:auto; border:1px solid #f0d4d4; background:#fff; color:#b91c1c; border-radius:9px; padding:8px 11px; font-size:12px; font-weight:800; font-family:inherit}
  .ok{border:0; background:#1f2937; color:#fff; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:800; font-family:inherit}

  .toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,16px); background:#111827; color:#fff; padding:9px 15px; border-radius:10px;
         font-size:12px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:90; max-width:90vw; text-align:center}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  /* ================= 잠금 화면 (복호화 전) ================= */
  body.locked .bar, body.locked .page, body.locked .hd, body.locked main, body.locked .menu{display:none !important}
  #lock{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
        background:radial-gradient(120% 120% at 50% 0%, #eff3f8 0%, #f3f5f7 42%, #e6ecf3 100%);
        padding:22px; overflow-y:auto; -webkit-overflow-scrolling:touch}
  body:not(.locked) #lock{display:none}
  .lk-card{width:min(392px,100%); margin:auto; background:#fff; border:1px solid #dde3ea; border-radius:18px;
           box-shadow:0 18px 44px rgba(15,23,42,.13), 0 2px 6px rgba(15,23,42,.05); padding:26px 24px 22px; text-align:center}
  .lk-ic{width:48px; height:48px; margin:0 auto 11px; border-radius:15px; background:#eef3f8; border:1px solid #e2e9f1;
         display:flex; align-items:center; justify-content:center; font-size:21px; line-height:1}
  .lk-card h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.6px; color:#0f172a}
  .lk-sub{margin:6px 0 17px; font-size:12px; font-weight:600; color:#7b8794; letter-spacing:-.2px}
  .lk-form{display:flex; flex-direction:column; gap:9px}
  .lk-card input[type=password]{width:100%; border:1px solid #d7dde4; border-radius:11px; background:#fbfcfd;
             padding:12px 10px; font-size:20px; font-weight:800; letter-spacing:9px; text-align:center; color:#0f172a;
             outline:none; font-family:inherit; -webkit-text-security:disc}
  .lk-card input[type=password]::placeholder{font-size:12.5px; font-weight:600; letter-spacing:0; color:#a9b4bf}
  .lk-card input[type=password]:focus{border-color:#8fa4b8; background:#fff; box-shadow:0 0 0 3px rgba(148,163,184,.18)}
  .lk-rem{display:flex; align-items:center; gap:7px; justify-content:center; font-size:12px; font-weight:700;
          color:#55637a; cursor:pointer; user-select:none; padding:1px 0}
  .lk-rem input{width:15px; height:15px; margin:0; accent-color:#1f2937; cursor:pointer}
  .lk-go{border:0; border-radius:11px; background:#1f2937; color:#fff; font-family:inherit; font-size:14px; font-weight:800;
         padding:12px 10px; cursor:pointer; letter-spacing:0; margin-top:2px}
  .lk-go:hover{background:#111827}
  .lk-go:active{transform:translateY(1px)}
  .lk-go[disabled]{opacity:.55; cursor:default}
  .lk-err{min-height:16px; margin-top:8px; font-size:11.5px; font-weight:700; color:#b91c1c; line-height:1.4}
  .lk-note{margin-top:10px; font-size:10.5px; color:#9aa6b2; font-weight:600; letter-spacing:-.2px}
  .lk-link{display:inline-block; margin-top:9px; font-size:11px; font-weight:700; color:#64748b; text-decoration:none;
           border-bottom:1px dotted #c3ccd6; padding-bottom:1px}
  .lk-link:hover{color:#1f2937}
  #lock.busy .lk-go{opacity:.65}
  @media (max-width:520px){
    .lk-card{padding:24px 18px 20px; border-radius:16px}
    .lk-card h1{font-size:18px}
  }

</style>
</head>
<body class="locked">

<div id="lock">
  <div class="lk-card">
    <div class="lk-ic">🔒</div>
    <h1>센텀르엘 (매물)</h1>
    <div class="lk-sub">동호수 · 분양가 메모장</div>
    <form class="lk-form" id="lk-form" autocomplete="off">
      <input id="lk-pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="비밀번호 4자리" aria-label="비밀번호" autocomplete="current-password">
      <label class="lk-rem"><input type="checkbox" id="lk-remember"> 이 기기에 기억하기</label>
      <button class="lk-go" type="submit" id="lk-open">열기</button>
    </form>
    <div class="lk-err" id="lk-err"></div>
    <a class="lk-link" id="lk-switch" href="#">휴대폰용 화면으로 보기</a>
    <div class="lk-note">비밀번호는 이 화면 밖으로 전송되지 않습니다.</div>
  </div>
</div>


<header class="hd" id="hd">
  <div class="hd1">
    <div class="brand">센텀르엘 (매물)<small>탭하면 메모장 · 101~106동 <b id="hs-all">–</b>세대</small></div>
    <div class="cnt">
      <i><span class="dot s"></span>매매 <b id="c-sale">–</b></i>
      <i><span class="dot e"></span>임대 <b id="c-rent">–</b></i>
      <i><span class="dot r"></span>보류 <b id="c-done">–</b></i>
      <i><span class="dot m"></span>메모 <b id="c-memo">–</b></i>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="filters">
    <div class="search">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="호수·메모" autocomplete="off">
    </div>
    <div class="seg" id="seg">
      <button data-st="all" class="on">전체</button>
      <button data-st="sale"><span class="dot s"></span>매매</button>
      <button data-st="rent"><span class="dot e"></span>임대</button>
      <button data-st="done"><span class="dot r"></span>보류·완료</button>
      <button data-st="memo"><span class="dot m"></span>메모</button>
    </div>
    <button class="more" id="btn-more" aria-label="더보기">⋯</button>
  </div>
</header>

<div class="menu" id="menu">
  <button id="m-export">📤 JSON 내보내기</button>
  <button id="m-import">📥 JSON 불러오기</button>
  <button id="m-reset">↩ 엑셀 기본값으로 초기화</button>
  <button id="m-mode">🖥 PC 보기로 전환</button>
  <button id="m-lock" data-lock>🔒 잠금</button>
  <button id="m-top">↑ 맨 위로</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>

<main id="board"></main>

<div class="bd" id="bd"></div>
<div class="sh" id="sh" role="dialog" aria-label="호실 메모장">
  <div class="sh-grab"></div>
  <div class="sh-h">
    <span class="sh-ho" id="sh-ho">—</span>
    <span class="ty" id="sh-ty">—</span>
    <button class="x" id="sh-x" aria-label="닫기">×</button>
  </div>
  <div class="price" id="sh-p">—</div>
  <div class="g2">
    <div><span>공급</span><b id="sh-gy">—</b></div>
    <div><span>전용</span><b id="sh-jn">—</b></div>
  </div>
  <div class="gye" id="sh-gye">—</div>
  <div class="st4" id="sh-st">
    <button data-s="none"><span class="dot w"></span>기본</button>
    <button data-s="sale"><span class="dot s"></span>매매 (연노랑)</button>
    <button data-s="rent"><span class="dot e"></span>임대 (하늘색)</button>
    <button data-s="done"><span class="dot r"></span>보류·완료 (빨강)</button>
  </div>
  <textarea id="sh-memo" placeholder="매물 정보·상담 내용·고객 반응 등을 적어두세요. 입력 즉시 이 브라우저에 저장됩니다."></textarea>
  <div class="sh-f">
    <span class="saved" id="sh-saved">저장됨</span>
    <button class="del" id="sh-del">메모 삭제</button>
    <button class="ok" id="sh-ok">닫기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==================== 앱 본체 ====================
   잠금이 풀린 뒤(복호화 성공 후)에만 lock 스크립트가 이 함수를 호출한다.
   매물 데이터는 평문으로 이 파일에 들어 있지 않다. */
window.__APP_MAIN__ = function(D){
const UNITS = D.units, AREA = D.area, SEED = D.seed, UNSPEC = D.unspec, SEED_META = D.meta || {};
const SEED_VER = D.seedVersion || 0, SEED_AT = D.seedAt || '';

const DONGS = [101,102,103,104,105,106];
const TOP = {101:67,102:67,103:67,104:48,105:67,106:67};
const BOTTOM = 5;
const F1_LABEL = {101:'판매시설',102:'판매시설',103:'판매시설',104:'판매시설',105:'판매시설, 어린이집',106:'판매시설, 관리사무소'};
const TYPE_COLOR = {
  '154':'#f8b28c','125A':'#f9d982','125B':'#f4cd72','125C':'#ecdb9b','125D':'#f8e9bd',
  '104A':'#b3d6ef','104B':'#ef9aa8','104C':'#f6c2cd','104D':'#dcc9ae','84':'#a8d8cd','244':'#cbb6e8'
};
const ST_NAME = {none:'기본', sale:'매매', rent:'임대', done:'보류·완료'};

function K(d,h,f){ return d+'-'+h+'-'+f; }
function hoNum(f,h){ return String(f) + String(h).padStart(2,'0'); }

const IDX = new Map(), LINE_TYPE = {}, DONG_CNT = {}, LINE_CNT = {};
UNITS.forEach(u=>{
  const [d,h,f,t,p] = u;
  IDX.set(K(d,h,f), {d,h,f,t,p});
  DONG_CNT[d] = (DONG_CNT[d]||0) + 1;
  LINE_CNT[d+'-'+h] = (LINE_CNT[d+'-'+h]||0) + 1;
  if(t !== '244') LINE_TYPE[d+'-'+h] = t;
});

/* ==================== 상태 저장 (PC판과 같은 키·같은 JSON 형식) ==================== */
const LS_KEY = 'centum-leel-memo-v2';
const LS_V5  = 'centum-leel-memo-v1';
let NOTES = {}, migrated = 0, seedRefreshed = 0;

function seedNotes(){
  const o = {};
  Object.keys(SEED).forEach(k=>{ o[k] = {s:SEED[k].s, m:SEED[k].m, t:0, seed:1}; });
  return o;
}
function cleanState(s){ return (s==='sale'||s==='rent'||s==='done') ? s : 'none'; }
function load(){
  let saved = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && typeof o === 'object' && o.notes) saved = o; }
  }catch(e){}
  NOTES = seedNotes();
  if(saved && saved.notes){
    const sameVer = (saved.seedVersion === SEED_VER);
    const legacy  = (saved.seedVersion === undefined);
    if(!sameVer) seedRefreshed = 1;
    Object.keys(saved.notes).forEach(k=>{
      if(!IDX.has(k)) return;
      const n = saved.notes[k] || {};
      const sd = SEED[k];
      if(n.u){
        NOTES[k] = {m:String(n.m||''), s:cleanState(n.s), t:n.t||0, u:1};
        return;
      }
      if(sameVer){
        NOTES[k] = {m:String(n.m||''), s:cleanState(n.s), t:n.t||0};
        if(n.seed) NOTES[k].seed = 1;
        return;
      }
      if(legacy && (!sd || cleanState(n.s) !== cleanState(sd.s) || String(n.m||'') !== String(sd.m||''))){
        NOTES[k] = {m:String(n.m||''), s:cleanState(n.s), t:n.t||0, u:1};
        return;
      }
      /* 그 외(예전 배포본의 시드 복사본)는 버리고 새 시드를 쓴다 */
    });
  }else if(!saved){
    try{
      const old = JSON.parse(localStorage.getItem(LS_V5) || 'null');
      if(old && old.notes){
        Object.keys(old.notes).forEach(k=>{
          if(!IDX.has(k) || SEED[k]) return;
          const m = String((old.notes[k]||{}).m || '').trim();
          if(!m) return;
          NOTES[k] = {m, s:'none', t:0};
          migrated++;
        });
      }
    }catch(e){}
  }
  persist();
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({v:3, seedVersion:SEED_VER, seedAt:SEED_AT, savedAt:new Date().toISOString(), notes:NOTES})); }
  catch(e){ toast('저장 공간이 부족합니다. JSON으로 백업해 두세요.'); }
}
function stateOf(k){ const n = NOTES[k]; return n ? cleanState(n.s) : 'none'; }
function memoOf(k){ const n = NOTES[k]; return n && n.m ? n.m : ''; }

/* ==================== 포맷 ==================== */
function wonShort(p){
  const eok = Math.floor(p/100000000), man = Math.round((p%100000000)/10000);
  if(eok && man) return eok+'억 '+man.toLocaleString('ko-KR')+'만';
  if(eok) return eok+'억';
  return man.toLocaleString('ko-KR')+'만';
}
function won(p){
  const eok = Math.floor(p/100000000), man = Math.round((p%100000000)/10000);
  if(eok && man) return eok+'억 '+man.toLocaleString('ko-KR')+'만 원';
  if(eok) return eok+'억 원';
  return man.toLocaleString('ko-KR')+'만 원';
}
function py(m){ return (m/3.3058).toFixed(1); }

/* ==================== 동별 배치표 ==================== */
const cellMap = new Map();
const board = document.getElementById('board');
/* 정적(SSR)으로 미리 그려 둔 6동을 비우고 스크립트로 다시 그린다.
   JS 미실행 환경(iOS 미리보기)에서는 이 줄이 돌지 않아 정적 화면이 그대로 보인다. */
board.innerHTML = '';

function buildDong(d){
  const sec = document.createElement('section');
  sec.className = 'dg';
  sec.id = 'd'+d;
  sec.dataset.d = d;

  const types = [...new Set([1,2,3,4,5,6].map(h=>LINE_TYPE[d+'-'+h]).filter(Boolean))];
  const un = (d!==106 || !UNSPEC.length) ? '' : `<span class="un">미지정${UNSPEC.length}</span>`;
  let html = `<div class="dg-h"><b>${d}동</b><span>${DONG_CNT[d].toLocaleString('ko-KR')}세대</span>`
           + `<span class="tg">${types.join(' · ')}</span>${un}</div>`;
  html += '<table><colgroup><col class="fc">' + '<col>'.repeat(6) + '</colgroup>';
  html += '<thead><tr><th>층</th>' + [1,2,3,4,5,6].map(h=>`<th style="background:${TYPE_COLOR[LINE_TYPE[d+'-'+h]]||'#eef3f5'}">${h}호</th>`).join('') + '</tr></thead><tbody>';

  for(let f=TOP[d]; f>=BOTTOM; f--){
    if(f===19 || (f===47 && d!==104)){
      html += `<tr><th class="evac">${f}</th><td class="evac" colspan="6">피난안전구역</td></tr>`;
      continue;
    }
    let tr = `<tr><th>${f}</th>`;
    for(let h=1; h<=6; h++){
      const u = IDX.get(K(d,h,f));
      if(u){
        const span = (u.t==='244') ? 2 : 1;
        const ho = hoNum(f,h);
        tr += `<td class="c" colspan="${span}" data-k="${K(d,h,f)}" data-d="${d}" data-ho="${h}" data-f="${f}" data-t="${u.t}">${ho}</td>`;
        if(span===2) h++;
      }else{
        const ph = (f===BOTTOM && (h===4||h===5));
        tr += `<td class="fx">${ph?'필로티':''}</td>`;
      }
    }
    html += tr + '</tr>';
  }
  html += '<tr><th>4</th><td class="fx">필로티</td><td class="fx">필로티</td><td class="fx">필로티</td><td class="fx" colspan="2">로비</td><td class="fx">필로티</td></tr>';
  html += '<tr><th>3</th><td class="fx" colspan="6">부대복리시설</td></tr>';
  html += '<tr><th>2</th><td class="fx" colspan="6">판매시설</td></tr>';
  html += `<tr><th>1</th><td class="fx" colspan="6">${F1_LABEL[d]||'판매시설'}</td></tr>`;
  html += '</tbody></table>';

  html += '<div class="dgsum">' + [1,2,3,4,5,6].map(h=>{
    const t = LINE_TYPE[d+'-'+h]||'';
    return `<span><b>${h}호</b> ${t} · ${LINE_CNT[d+'-'+h]||0}</span>`;
  }).join('') + '</div>';

  sec.innerHTML = html;
  sec.querySelectorAll('td.c[data-k]').forEach(td=> cellMap.set(td.dataset.k, td));
  return sec;
}

/* 층 미지정 안내 */
(function(){
  if(!UNSPEC.length) return;
  const el = document.createElement('div');
  el.className = 'unspec';
  el.innerHTML = `<span class="ub">층 미지정 ${UNSPEC.length}</span>` + UNSPEC.map(u=>{
    const a = AREA[u.layout_type] || [0,0,0,0,0];
    return `<b>${u.label}</b> · ${u.type}타입 · ${a[2].toFixed(1)}㎡(${py(a[2])}평) · P ${u.prem}` +
           (u.broker?' · '+u.broker:'') + (u.memo?' · '+u.memo:'') + (u.deposit?' · '+u.deposit:'');
  }).join('<br>') + '<br>층이 정해지지 않아 임의의 층에 넣지 않았습니다.';
  board.appendChild(el);
})();

DONGS.forEach(d=> board.appendChild(buildDong(d)));

/* ---- 동 바로가기 탭 ---- */
(function(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  DONGS.forEach(d=>{
    const b = document.createElement('button');
    b.dataset.d = d;
    b.innerHTML = `${d}동<span class="n">${DONG_CNT[d].toLocaleString('ko-KR')}</span>`;
    b.onclick = ()=> jumpTo(d);
    tabs.appendChild(b);
  });
})();

function hdH(){ return document.getElementById('hd').offsetHeight + 4; }
function jumpTo(d){
  const el = document.getElementById('d'+d);
  if(!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - hdH();
  window.scrollTo({top: Math.max(0, y), behavior:'smooth'});
  setTab(d);
}
function setTab(d){
  document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('on', b.dataset.d === String(d)));
}
/* 스크롤 위치에 맞춰 현재 동 표시 */
let scT = null;
window.addEventListener('scroll', ()=>{
  if(scT) return;
  scT = requestAnimationFrame(()=>{
    scT = null;
    const top = window.scrollY + hdH() + 12;
    let cur = 101;
    DONGS.forEach(d=>{
      const el = document.getElementById('d'+d);
      if(el && el.getBoundingClientRect().top + window.scrollY <= top) cur = d;
    });
    setTab(cur);
  });
}, {passive:true});

/* ==================== 색칠 · 필터 ==================== */
function paintCell(k){
  const td = cellMap.get(k); if(!td) return;
  const st = stateOf(k);
  td.classList.remove('s-sale','s-rent','s-done');
  if(st==='sale') td.classList.add('s-sale');
  if(st==='rent') td.classList.add('s-rent');
  if(st==='done') td.classList.add('s-done');
}
function paintAll(){ cellMap.forEach((td,k)=> paintCell(k)); updateCounts(); }
function norm(s){ return (s||'').toLowerCase().replace(/\s+/g,''); }
function curFilter(){
  return {q: norm(document.getElementById('q').value),
          st: document.querySelector('#seg button.on').dataset.st};
}
function isMatch(td, st, f){
  if(f.st==='sale' && st!=='sale') return false;
  if(f.st==='rent' && st!=='rent') return false;
  if(f.st==='done' && st!=='done') return false;
  if(f.st==='memo' && !memoOf(td.dataset.k).trim()) return false;
  if(f.q){
    const hay = norm(td.dataset.d+'동'+td.dataset.ho+'호'+td.dataset.f+'층'+hoNum(td.dataset.f, td.dataset.ho)
                     + ' ' + td.dataset.k + ' ' + ST_NAME[st] + ' ' + memoOf(td.dataset.k));
    if(!hay.includes(f.q)) return false;
  }
  return true;
}
function applyFilters(){
  const f = curFilter();
  cellMap.forEach((td,k)=>{
    const ok = isMatch(td, stateOf(k), f);
    td.classList.toggle('dim', !ok);
    td.classList.toggle('hit', !!f.q && ok);
  });
  updateCounts();
}
function updateCounts(){
  let sale=0, rent=0, done=0, memo=0;
  cellMap.forEach((td,k)=>{
    const st = stateOf(k);
    if(st==='sale') sale++;
    if(st==='rent') rent++;
    if(st==='done') done++;
    if(memoOf(k).trim()) memo++;
  });
  document.getElementById('c-sale').textContent = sale;
  document.getElementById('c-rent').textContent = rent;
  document.getElementById('c-done').textContent = done;
  document.getElementById('c-memo').textContent = memo;
}

/* ==================== 하단 시트 ==================== */
const sh = document.getElementById('sh'), bd = document.getElementById('bd');
const shHo = document.getElementById('sh-ho'), shTy = document.getElementById('sh-ty'),
      shP = document.getElementById('sh-p'), shGy = document.getElementById('sh-gy'), shJn = document.getElementById('sh-jn'),
      shGye = document.getElementById('sh-gye'), shSt = document.getElementById('sh-st'),
      shMemo = document.getElementById('sh-memo'), shSaved = document.getElementById('sh-saved');
let cur = null, curTd = null, saveT = null, selTd = null;

function selectCell(td){
  if(selTd) selTd.classList.remove('sel');
  selTd = td;
  if(td) td.classList.add('sel');
}
function autoGrow(){
  shMemo.style.height = 'auto';
  const max = Math.round(window.innerHeight * 0.4);
  shMemo.style.height = Math.min(shMemo.scrollHeight + 2, max) + 'px';
}
function openSheet(td){
  const k = td.dataset.k;
  const u = IDX.get(k); if(!u) return;
  if(cur && cur !== k) writeNote();
  cur = k; curTd = td;
  selectCell(td);

  const a = AREA[u.t] || [0,0,0,0,0];
  shHo.textContent = `${u.d}동 ${hoNum(u.f,u.h)}호`;
  shTy.textContent = u.t + '타입';
  shTy.style.background = TYPE_COLOR[u.t] || '#f1f5f9';
  shP.textContent = won(u.p);
  shGy.innerHTML = `<b>${a[2].toFixed(2)}㎡</b><i>${py(a[2])}평</i>`;
  shJn.innerHTML = `<b>${a[0].toFixed(2)}㎡</b><i>${py(a[0])}평</i>`;
  shGye.innerHTML = `계약금 <b>5%</b> · <b>${wonShort(Math.round(u.p*0.05))}</b>`;
  shMemo.value = memoOf(k);
  autoGrow();
  setStUI(stateOf(k));
  shSaved.classList.remove('on');

  bd.classList.add('on'); sh.classList.add('on');
  sh.scrollTop = 0;
}
function closeSheet(){
  if(!cur) return;
  writeNote();
  sh.classList.remove('on'); bd.classList.remove('on');
  cur = null; curTd = null;
}
function setStUI(st){
  shSt.querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.s===st));
}
function writeNote(){
  if(!cur) return;
  const txt = shMemo.value;
  const n = NOTES[cur];
  if(!n){ if(!txt.trim()) return; NOTES[cur] = {m:txt, s:'none', t:Date.now(), u:1}; }
  else { n.m = txt; n.t = Date.now(); n.u = 1; }
  persist(); paintCell(cur); setStUI(stateOf(cur)); flash(); updateCounts();
}
function flash(){
  shSaved.textContent = '저장됨'; shSaved.classList.add('on');
  clearTimeout(saveT); saveT = setTimeout(()=> shSaved.classList.remove('on'), 1300);
}
shSt.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !cur) return;
  const n = NOTES[cur] || (NOTES[cur] = {m:'', s:'none', t:0});
  n.s = cleanState(b.dataset.s); n.m = shMemo.value; n.t = Date.now(); n.u = 1;
  persist(); paintCell(cur); setStUI(stateOf(cur)); flash(); updateCounts();
});
shMemo.addEventListener('input', ()=>{
  autoGrow();
  clearTimeout(saveT);
  shSaved.textContent = '입력 중…'; shSaved.classList.add('on');
  saveT = setTimeout(writeNote, 500);
});
shMemo.addEventListener('blur', writeNote);
document.getElementById('sh-x').onclick = closeSheet;
document.getElementById('sh-ok').onclick = closeSheet;
bd.onclick = closeSheet;
document.getElementById('sh-del').onclick = ()=>{
  if(!cur) return;
  if(!confirm('이 호실의 메모와 색상을 모두 지울까요?\n(엑셀에서 들어온 기본 정보도 지워집니다)')) return;
  NOTES[cur] = {m:'', s:'none', t:Date.now(), u:1};
  persist(); shMemo.value=''; setStUI('none'); paintCell(cur); updateCounts();
  shSaved.textContent='삭제됨'; shSaved.classList.add('on');
};
window.addEventListener('beforeunload', ()=>{ if(cur) writeNote(); });

board.addEventListener('click', e=>{
  const td = e.target.closest('td.c[data-k]');
  if(!td) return;
  openSheet(td);
});

/* ==================== 필터 · 메뉴 ==================== */
document.getElementById('seg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#seg button').forEach(x=> x.classList.toggle('on', x===b));
  applyFilters();
});
const qEl = document.getElementById('q');
qEl.addEventListener('input', applyFilters);

const menu = document.getElementById('menu'), moreBtn = document.getElementById('btn-more');
function hideMenu(){ menu.classList.remove('on'); }
moreBtn.onclick = e=>{
  e.stopPropagation();
  const r = moreBtn.getBoundingClientRect();
  menu.style.top = (r.bottom + 4) + 'px';
  menu.classList.toggle('on');
};
document.addEventListener('click', e=>{ if(!e.target.closest('#menu')) hideMenu(); });
document.getElementById('m-top').onclick = ()=>{ hideMenu(); window.scrollTo({top:0, behavior:'smooth'}); setTab(101); };

/* ==================== 내보내기 / 불러오기 / 초기화 (PC판과 같은 JSON) ==================== */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 2400); }
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
document.getElementById('m-export').onclick = ()=>{
  hideMenu();
  if(cur) writeNote();
  const keys = Object.keys(NOTES);
  const out = {app:'센텀르엘 동호수·분양가 메모장', version:2, seedAt:'2026-11-21',
               exportedAt:new Date().toISOString(), count:keys.length, notes:NOTES};
  const blob = new Blob([JSON.stringify(out,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `센텀르엘_메모_${stamp()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast(`${keys.length}호실을 파일로 내보냈습니다.`);
};
document.getElementById('m-import').onclick = ()=>{ hideMenu(); document.getElementById('file').click(); };
document.getElementById('file').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      const notes = o && o.notes ? o.notes : o;
      if(!notes || typeof notes !== 'object') throw new Error('형식이 올바르지 않습니다.');
      const cnt = Object.keys(notes).length;
      const mine = Object.keys(NOTES).length;
      if(!confirm(`이 파일의 ${cnt}호실 기록을 불러옵니다.\n지금 이 브라우저의 기록 ${mine}호실은 사라집니다.\n계속할까요?`)) return;
      const clean = seedNotes();
      Object.keys(notes).forEach(k=>{
        if(!IDX.has(k)) return;
        const n = notes[k] || {};
        let s = n.s; if(s === 'memo') s = 'none';
        clean[k] = {m:String(n.m||''), s:cleanState(s), t:n.t||Date.now(), u:1};
      });
      NOTES = clean; persist(); paintAll(); toast(`${Object.keys(clean).length}호실을 불러왔습니다.`);
    }catch(err){ alert('불러오지 못했습니다: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f, 'utf-8');
});
document.getElementById('m-reset').onclick = ()=>{
  hideMenu();
  if(!confirm('이 브라우저에서 수정·추가한 내용을 모두 지우고\n엑셀 26.11 기본값으로 되돌립니다.\n계속할까요?')) return;
  NOTES = seedNotes(); persist(); paintAll();
  if(cur){ shMemo.value = memoOf(cur); setStUI(stateOf(cur)); }
  toast('엑셀 26.11 기본값으로 되돌렸습니다.');
};

/* ==================== 시작 ==================== */
load();
paintAll(); applyFilters(); setTab(101);
if(migrated) setTimeout(()=> toast(`이전 메모 ${migrated}건을 이어받았습니다.`), 600);
if(seedRefreshed) setTimeout(()=> toast('최신 매물로 업데이트했습니다. 직접 적은 메모는 그대로 남아 있습니다.'), 600);
(function(){ const hs = document.getElementById('hs-all'); if(hs) hs.textContent = cellMap.size.toLocaleString('ko-KR'); })();
const mMode = document.getElementById('m-mode');
if(mMode) mMode.onclick = ()=>{ hideMenu(); try{ localStorage.setItem('centum-leel-mode','pc'); }catch(e){} location.href = 'pc.html' + location.search; };
window.addEventListener('resize', ()=>{});
};
</script>
<script>
/* ==================== 잠금 · 복호화 (AES-256-GCM / PBKDF2-HMAC-SHA256) ====================

  const BUILD = '20261121';
  const LS_DEV  = 'centum-leel-device-key-v1';   /* 이 기기에 기억하기 = 복호화 키(원시 바이트) */
  const SS_LOCK = 'centum-leel-relocked';         /* 🔒 잠금 직후에는 기억한 키를 쓰지 않는다 */
  const MODE_KEY = 'centum-leel-mode';

  const $ = id => document.getElementById(id);
  const b2u = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; };
  const u2b = v => { const u8 = (v instanceof Uint8Array) ? v : new Uint8Array(v); let s=''; for(let i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]); return btoa(s); };

  let busy = false, appOn = false;
  const setErr = m => { const e = $('lk-err'); if(e) e.textContent = m || ''; };

  async function deriveKey(pw){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b2u(ENC.salt), iterations:ENC.iter, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, true, ['decrypt']);
  }
  async function decryptWith(key){
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b2u(ENC.iv), additionalData:new TextEncoder().encode(ENC.aad || '') },
      key, b2u(ENC.data));
    return JSON.parse(new TextDecoder('utf-8').decode(pt));
  }

  function start(payload){
    if(appOn) return;
    appOn = true;
    document.body.classList.remove('locked');
    try{
      window.__APP_MAIN__(payload);
    }catch(e){
      console.error(e);
      document.body.classList.add('locked');
      appOn = false;
      setErr('메모장을 여는 중 문제가 생겼습니다. 새로고침해 주세요.');
    }
    const pw = $('lk-pw'); if(pw) pw.value = '';
  }

  /* ---------- 화면 전환 링크 (PC ↔ 모바일) ---------- */
  (function(){
    const a = $('lk-switch'); if(!a) return;
    const isMobileFile = /mobile\.html$/i.test(location.pathname);
    const target = isMobileFile ? 'pc.html' : 'mobile.html';
    a.href = target + '?v=' + BUILD;
    a.textContent = isMobileFile ? 'PC 화면으로 보기' : '휴대폰용 화면으로 보기';
    a.addEventListener('click', ()=>{
      try{ localStorage.setItem(MODE_KEY, isMobileFile ? 'pc' : 'mobile'); }catch(e){}
    });
  })();

  /* ---------- 🔒 잠금 버튼 ---------- */
  document.querySelectorAll('[data-lock]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.preventDefault();
      if(!confirm('다시 잠글까요?\n열려면 비밀번호를 다시 입력해야 합니다.')) return;
      try{ sessionStorage.setItem(SS_LOCK, '1'); }catch(_){}
      location.reload();
    });
  });

  /* ---------- 열기 ---------- */
  const form = $('lk-form');
  if(form) form.addEventListener('submit', async e=>{
    e.preventDefault();
    if(busy) return;
    const pwEl = $('lk-pw');
    const pw = (pwEl.value || '').replace(/[^0-9]/g, '');
    if(!pw){ setErr('비밀번호를 입력해 주세요.'); pwEl.focus(); return; }
    busy = true; setErr('');
    $('lk-open').textContent = '여는 중…';
    $('lock').classList.add('busy');
    try{
      const key = await deriveKey(pw);
      const payload = await decryptWith(key);
      const remember = $('lk-remember').checked;
      try{
        if(remember) localStorage.setItem(LS_DEV, u2b(await crypto.subtle.exportKey('raw', key)));
        else localStorage.removeItem(LS_DEV);
        sessionStorage.removeItem(SS_LOCK);
      }catch(_){}
      start(payload);
    }catch(err){
      setErr('비밀번호가 맞지 않습니다. 다시 확인해 주세요.');
      pwEl.value = ''; pwEl.focus();
    }finally{
      busy = false;
      $('lk-open').textContent = '열기';
      $('lock').classList.remove('busy');
    }
  });

  /* ---------- 시작: 기억한 키가 있으면 묻지 않고 바로 열기 ---------- */
  (async function boot(){
    if(!(window.crypto && crypto.subtle)){
      setErr('이 브라우저에서는 암호화된 메모장을 열 수 없습니다. 최신 브라우저로 열어 주세요.');
      return;
    }
    let relocked = false, devKey = null;
    try{ relocked = sessionStorage.getItem(SS_LOCK) === '1'; }catch(e){}
    try{ devKey = localStorage.getItem(LS_DEV); }catch(e){}
    if(relocked){ if($('lk-remember')) $('lk-remember').checked = !!devKey; return; }
    if(!devKey){ if($('lk-remember')) $('lk-remember').checked = false; setTimeout(()=>{ const p = $('lk-pw'); if(p && !appOn) p.focus(); }, 60); return; }
    try{
      const key = await crypto.subtle.importKey('raw', b2u(devKey), { name:'AES-GCM' }, true, ['decrypt']);
      start(await decryptWith(key));
    }catch(e){
      try{ localStorage.removeItem(LS_DEV); }catch(_){}
    }
  })();
})();

</script>
